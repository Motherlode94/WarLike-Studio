name: Studio quality gates
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # Playwright 1.56 Chromium dependencies are not supported on ubuntu-26.04 runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Install Chromium smoke-test tools
        run: |
          npm init -y
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Browser boot and mobile control regression
        run: |
          cp tests/storage-browser.html dist/_storage-qa.html
          cp tests/instrument-qa.html dist/_instrument-qa.html
          cd dist
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/warlike-studio-http.log 2>&1 &
          cd ..
          sleep 2
          node tests/browser-smoke.mjs
          node tests/reference-workspace-browser.mjs
          node tests/effects-dsp-browser.mjs
          node tests/instrument-dsp-browser.mjs
          node tests/recording-browser.mjs
          node tests/recording-count-in-browser.mjs
          node tests/vocal-audio-browser.mjs
          node tests/beat-demos-browser.mjs
          node tests/export-browser.mjs
      - name: Recording count-in evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recording-count-in
          path: artifacts/recording-count-in/
          if-no-files-found: warn
      - name: Reference workspace screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-reference-workspaces
          path: artifacts/reference-workspaces/
          if-no-files-found: ignore
      - name: Beat demo audio report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-beat-demos
          path: artifacts/beat-demos/
          if-no-files-found: ignore

      - name: Human vocal demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-human-vocal-demos
          path: artifacts/vocal-demos/
          if-no-files-found: ignore

  factory-session:
    name: Factory certification (${{ matrix.song }})
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        song: [nocturne, soleil, brume, rives, pluie, horizon, eclats, kin, lumiere]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Save, reopen, play and export full arrangement
        env:
          FACTORY_SONG: ${{ matrix.song }}
        run: |
          cp tests/factory-audio-qa.html dist/_factory-audio-qa.html
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist >/tmp/warlike-factory-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/ -o /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/ -o /dev/null
          node tests/offline-schedule-browser.mjs
          timeout --signal=TERM --kill-after=15s 12m node tests/factory-session-browser.mjs
      - name: Full factory session evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-factory-sessions-${{ matrix.song }}
          retention-days: 7
          path: artifacts/factory-sessions/
          if-no-files-found: ignore
