name: Studio instrument polyphony and WAV
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: node --test tests/instrument-render-metrics.test.mjs
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - name: Render overlapping instrument voices and verify PCM
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist >/tmp/studio-polyphony-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/ -o /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/ -o /dev/null
          node tests/instrument-polyphony-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrument-polyphony
          path: artifacts/instrument-polyphony/
          if-no-files-found: ignore
