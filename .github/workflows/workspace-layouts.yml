name: Studio workspace layouts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - name: Window geometry and workspace restoration
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist >/tmp/studio-context-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/ -o /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/ -o /dev/null
          node tests/reference-fidelity-browser.mjs
          node tests/workspace-layout-browser.mjs
          node tests/plugin-windows-browser.mjs
          node tests/preset-folders-browser.mjs
          node tests/game-sounds-browser.mjs
          node tests/session-preview-browser.mjs
          node tests/project-compositions-browser.mjs
          node tests/sampler-history-browser.mjs
          node tests/instru-bank-browser.mjs
          node tests/instrument-faces-browser.mjs
          node tests/effect-faces-browser.mjs
      - name: Reference interface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-fidelity
          path: artifacts/reference-fidelity/
          if-no-files-found: warn

      - name: Common plugin commands evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-command-bar
          path: artifacts/plugin-command-bar/
          if-no-files-found: warn

      - name: Preset folders browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preset-folders
          path: artifacts/preset-folders/
          if-no-files-found: warn

      - name: Game sounds audio and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-sounds
          path: artifacts/game-sounds/
          if-no-files-found: warn

      - name: Session preview audio and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-preview
          path: artifacts/session-preview/
          if-no-files-found: warn

      - name: Project dialog compositions evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-compositions
          path: artifacts/project-compositions/
          if-no-files-found: warn

      - name: Instru sound bank audio and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instru-sound-bank
          path: artifacts/instru-bank/
          if-no-files-found: warn

      - name: Individual instrument panel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrument-faces
          path: artifacts/instrument-faces/
          if-no-files-found: warn

      - name: Individual effect panel screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: effect-faces
          path: artifacts/effect-faces/
          if-no-files-found: warn

  theme-matrix:
    name: Rendered themes and project integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - name: Four themes, two layouts, three viewports
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist >/tmp/studio-theme-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/ -o /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/ -o /dev/null
          node tests/workspace-theme-browser.mjs
      - name: Rendered theme matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-theme-matrix
          path: artifacts/workspace-themes/
          if-no-files-found: warn

  master-rack:
    name: Master rack routing, PCM and interface
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - name: Real routing and WAV roundtrip
        run: node tests/master-rack-dsp-browser.mjs
      - name: Floating rack, editing, comparison and cold reopen
        run: node tests/master-rack-browser.mjs
      - name: Window mouse behavior
        run: node tests/window-mouse-browser.mjs
      - name: Window mouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-mouse
          path: artifacts/window-mouse/
          if-no-files-found: warn
      - name: Master rack evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-rack
          path: artifacts/master-rack/
          if-no-files-found: warn

  plugin-mouse-matrix:
    name: Mouse behavior — ${{ matrix.family }} plugins
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        family: [effect, instrument]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - name: Every native editor through actual pointer gestures
        env:
          STUDIO_MOUSE_FAMILY: ${{ matrix.family }}
        run: node tests/plugin-mouse-matrix-browser.mjs
      - name: Per-plugin mouse report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-mouse-${{ matrix.family }}
          path: artifacts/plugin-mouse-matrix/
          if-no-files-found: warn
