<!doctype html><html lang="fr"><meta charset="utf-8"><title>Vérification capture CHAYAH</title><button id="run">Vérifier une prise synthétique</button><pre id="result">Prêt</pre><script type="module">
import {createRecordingGraph,measureBuffer,normalisationGain} from '../dist/recording.js';
document.getElementById('run').onclick=async()=>{let ctx,graph,osc;try{ctx=new AudioContext();await ctx.resume();const gain=ctx.createGain(),input=ctx.createMediaStreamDestination();gain.gain.value=.005;osc=ctx.createOscillator();osc.frequency.value=300;osc.connect(gain);gain.connect(input);graph=createRecordingGraph(ctx,input.stream,12);const chunks=[],rec=new MediaRecorder(graph.stream);rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};rec.start(80);osc.start();await new Promise(resolve=>setTimeout(resolve,850));const done=new Promise(resolve=>rec.onstop=resolve);rec.stop();await done;const raw=await new Blob(chunks,{type:rec.mimeType}).arrayBuffer(),buffer=await ctx.decodeAudioData(raw),level=measureBuffer(buffer),normal=normalisationGain(level),expected=20*Math.log10(.005)+12,normalizedPeak=level.peakDb+normal.gainDb;const passed=Math.abs(level.peakDb-expected)<3&&Math.abs(normalizedPeak+6)<.01&&buffer.duration>.5;document.getElementById('result').textContent=JSON.stringify({passed,recordedSeconds:buffer.duration,inputPeakDb:20*Math.log10(.005),requestedGainDb:12,recordedPeakDb:level.peakDb,normalisationGainDb:normal.gainDb,normalizedPeakDb:normalizedPeak},null,2);}catch(e){document.getElementById('result').textContent=e.stack;}finally{graph?.dispose();osc?.stop();await ctx?.close();}};
</script></html>
