<!doctype html><html lang="fr"><meta charset="utf-8"><title>CHAYAH audio QA</title>
<style>body{background:#172016;color:#e1e7d7;font:16px system-ui;padding:40px}button{padding:14px}pre{white-space:pre-wrap;line-height:1.6}</style>
<h1>CHAYAH · vérification du signal</h1><button id="run">Lancer les essais audio</button><pre id="results">Prêt.</pre>
<script type="module">
import {AudioEngine} from '../dist/audio.js';
import {INSTRUMENTS,DRUM_VOICES} from '../dist/plugins.js';
import {createFactorySession} from '../dist/content.js';
import {masteringSettings,applyMasterPreset} from '../dist/mastering.js';
const results=document.querySelector('#results'),button=document.querySelector('#run');
const rms=data=>Math.sqrt(data.reduce((sum,v)=>sum+v*v,0)/data.length);
function stats(buffer){const data=buffer.getChannelData(0);if(!data.every(Number.isFinite))throw new Error('Échantillons non finis');return rms(data);}
button.onclick=async()=>{button.disabled=true;results.textContent='Rendu en cours…';const lines=[];
try{
  const project=createFactorySession(),engine=new AudioEngine(()=>project,()=>new Map());
  for(const type of Object.keys(INSTRUMENTS)){
    const ctx=new OfflineAudioContext(1,44100*4,44100),track=project.tracks.find(t=>t.type===type);
    if(type==='drums')engine.drum(ctx,ctx.destination,'kick',.05,false,track.instrument);else engine.synth(ctx,ctx.destination,type,type==='bass'?33:69,.05,.6,false,track.instrument);
    const level=stats(await ctx.startRendering());if(level<.001)throw new Error(type+' silencieux');lines.push('PASS '+INSTRUMENTS[type].name+' RMS '+level.toFixed(4));
  }
  for(const voice of Object.keys(DRUM_VOICES)){const wav=await engine.renderDrumWav(voice),v=new DataView(wav);let energy=0;for(let i=44;i<wav.byteLength;i+=2)energy+=v.getInt16(i,true)**2;if(!energy||v.getUint32(24,true)!==44100)throw new Error(voice+' WAV invalide');lines.push('PASS WAV '+voice+' '+wav.byteLength+' octets');}
  async function sine({eq=0,comp=false,frequency=60,amplitude=.02}={}){
    const track=project.tracks[0];track.volume=0;project.masterVolume=0;
    for(const e of Object.values(track.effects))e.enabled=false;
    Object.assign(track.effects.prism,{enabled:true,low:eq});Object.assign(track.effects.glue,{enabled:comp,threshold:-30,ratio:8,attack:3,release:100,makeup:0});
    const ctx=new OfflineAudioContext(1,44100*2,44100),graph=engine.buildGraph(ctx),osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=frequency;gain.gain.value=amplitude;osc.connect(gain);gain.connect(graph.channels.get(track.id).input);osc.start(.1);osc.stop(1.9);return stats(await ctx.startRendering());
  }
  const flat=await sine(),boost=await sine({eq:12});if(boost/flat<2.5)throw new Error('PRISM sans effet');lines.push('PASS PRISM +12 dB : ratio RMS '+(boost/flat).toFixed(2));
  const dry=await sine({frequency:440,amplitude:.8}),compressed=await sine({comp:true,frequency:440,amplitude:.8});if(compressed/dry>.5)throw new Error('GLUE sans réduction');lines.push('PASS GLUE : ratio RMS '+(compressed/dry).toFixed(2));
  async function mixSignal(effect,settings={},frequency=1500){
    const p=createFactorySession(),track=p.tracks[0];p.tracks=[track];track.volume=0;p.masterVolume=-12;for(const e of Object.values(track.effects))e.enabled=false;Object.assign(track.effects[effect],settings,{enabled:true});
    const e=new AudioEngine(()=>p,()=>new Map()),ctx=new OfflineAudioContext(1,44100*2,44100),graph=e.buildGraph(ctx),osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=frequency;gain.gain.value=.4;osc.connect(gain);gain.connect(graph.channels.get(track.id).input);osc.start(.1);osc.stop(1.9);const buffer=await ctx.startRendering();return {data:buffer.getChannelData(0),rms:stats(buffer)};
  }
  const bandFlat=await mixSignal('prism',{mid:0,midFreq:3000,q:5},3000),bandBoost=await mixSignal('prism',{mid:12,midFreq:3000,q:5},3000),bandAway=await mixSignal('prism',{mid:12,midFreq:500,q:5},3000);if(bandBoost.rms/bandFlat.rms<2||bandAway.rms/bandFlat.rms>1.2)throw new Error('PRISM fréquence/Q sans effet');lines.push('PASS PRISM fréquence/Q : bande déplacée à 3 kHz');
  const cleanColor=await mixSignal('color',{drive:0,mix:1}),dryColor=await mixSignal('color',{drive:1,mix:0}),wetColor=await mixSignal('color',{drive:1,mix:1}),halfColor=await mixSignal('color',{drive:1,mix:.5}),trimColor=await mixSignal('color',{drive:1,mix:1,output:-6});if(Math.abs(dryColor.rms/cleanColor.rms-1)>.02||wetColor.rms<dryColor.rms||halfColor.rms<dryColor.rms||halfColor.rms>wetColor.rms||Math.abs(trimColor.rms/wetColor.rms-.501)>.02)throw new Error('COLOR mix/output invalide');lines.push('PASS COLOR : Mix 0/50/100%, sortie −6 dB');
  const dryGlue=await mixSignal('glue',{threshold:-30,ratio:8,knee:0,mix:0}),wetGlue=await mixSignal('glue',{threshold:-30,ratio:8,knee:0,mix:1}),halfGlue=await mixSignal('glue',{threshold:-30,ratio:8,knee:0,mix:.5});if(wetGlue.rms>=halfGlue.rms||halfGlue.rms>=dryGlue.rms)throw new Error('GLUE compression parallèle invalide');lines.push('PASS GLUE : compression parallèle 0/50/100%');
  async function masterSignal(settings,{frequency=60,amplitude=.01,opposed=false}={}){
    const p={masterVolume:0,bpm:120,tracks:[],mastering:masteringSettings(settings)},e=new AudioEngine(()=>p,()=>new Map()),ctx=new OfflineAudioContext(2,44100*2,44100),graph=e.buildGraph(ctx),source=ctx.createBufferSource(),buffer=ctx.createBuffer(2,44100*2,44100);
    for(let c=0;c<2;c++){const data=buffer.getChannelData(c);for(let i=0;i<data.length;i++)data[i]=i>2205&&i<83790?amplitude*Math.sin(2*Math.PI*frequency*i/44100)*(c===1&&opposed?-1:1):0;}source.buffer=buffer;source.connect(graph.master);source.start();return ctx.startRendering();
  }
  const neutral=await masterSignal(),equalized=await masterSignal({balance:{enabled:true,low:6}});const eqRatio=stats(equalized)/stats(neutral);if(eqRatio<1.5)throw new Error('BALANCE sans effet');lines.push('PASS BALANCE : ratio RMS '+eqRatio.toFixed(2));
  const uncompressed=await masterSignal({}, {frequency:440,amplitude:.7}),pressed=await masterSignal({press:{enabled:true,threshold:-30,ratio:6,attack:3,release:100}}, {frequency:440,amplitude:.7});const compRatio=stats(pressed)/stats(uncompressed);if(compRatio>.8)throw new Error('PRESS sans effet');lines.push('PASS PRESS : ratio RMS '+compRatio.toFixed(2));
  for(const ceiling of [-1,-6,-12]){const limited=await masterSignal({peak:{enabled:true,drive:18,ceiling,release:100}},{frequency:977,amplitude:2,opposed:true});let peak=0;for(let c=0;c<2;c++)for(const value of limited.getChannelData(c)){if(!Number.isFinite(value))throw new Error('PEAK non fini');peak=Math.max(peak,Math.abs(value));}const peakDb=20*Math.log10(peak);if(peakDb>ceiling+.001||peak<.01)throw new Error('Plafond PEAK dépassé '+peakDb);lines.push('PASS PEAK plafond '+ceiling+' dBFS : '+peakDb.toFixed(3)+' dBFS, stéréo opposée');}
  const bypassed=await masterSignal({bypass:true,balance:{enabled:true,low:6},press:{enabled:true,threshold:-30,ratio:6},peak:{enabled:true,drive:18,ceiling:-12}});let difference=0;for(let i=0;i<bypassed.length;i++)difference=Math.max(difference,Math.abs(bypassed.getChannelData(0)[i]-neutral.getChannelData(0)[i]));if(difference>1e-6)throw new Error('Bypass master non neutre');lines.push('PASS bypass mastering : identique à la chaîne désactivée');
  const session=createFactorySession();applyMasterPreset(session,2);const exporter=new AudioEngine(()=>session,()=>new Map()),wav=await exporter.exportWav();const view=new DataView(wav);let peak=0;for(let i=44;i<wav.byteLength;i+=2)peak=Math.max(peak,Math.abs(view.getInt16(i,true)));const peakDb=20*Math.log10(peak/32768);if(peak<500||peakDb>-.99)throw new Error('Export session mastering invalide');lines.push('PASS session 16 mesures + Trap Focus : WAV stéréo '+(wav.byteLength/1e6).toFixed(2)+' Mo, crête '+peakDb.toFixed(1)+' dBFS');
  results.textContent=lines.join('\n')+'\nTOUS LES ESSAIS ONT RÉUSSI';
}catch(error){results.textContent=lines.join('\n')+'\nFAIL '+error.stack;}finally{button.disabled=false;}};
</script></html>
