<!doctype html><meta charset="utf-8"><title>WarLike Flow · Audio QA</title><style>body{background:#20251f;color:#e2ddc9;font:14px monospace;padding:26px}button{padding:12px}pre{white-space:pre-wrap}</style><h1>WarLike Flow · Traitements réels</h1><button id="run">Tester les nouveaux processeurs</button><pre id="results">Prêt.</pre><script type="module">
import {AudioEngine,emptyProject} from '../dist/audio.js';
import {placeInsert} from '../dist/plugins.js';
import {STUDIO_EFFECTS} from '../dist/studio-packs.js?v=0.14.0';
import {prepareStudioContext} from '../dist/studio-pack-audio.js?v=0.14.0';
import {masteringSettings} from '../dist/mastering.js';
import {samplerVoice} from '../dist/sampler.js';
import {detectPitch} from '../dist/tune-dsp.js';
const output=document.querySelector('#results'),assert=(v,m)=>{if(!v)throw Error(m);},rate=48000;
const rms=(data,a=.2,b=1.2)=>{let e=0;for(let i=Math.floor(a*rate);i<Math.min(data.length,b*rate);i++)e+=data[i]**2;return Math.sqrt(e/((b-a)*rate));};
const settings={circuiteq:{presence:10,presenceFreq:440},circuitbus:{threshold:-35,ratio:8,attack:1},circuitcolor:{drive:18,mix:1,output:0},alterdouble:{mix:.7,depth:4},alterecho:{beats:.125,mix:.7,duck:.5},alterfilter:{cutoff:200,q:1,depth:0,mix:1},vectoreq:{f2:440,g2:10,q2:3},vectorcomp:{threshold:-35,ratio:8,attack:1},vectorlimit:{drive:18,ceiling:-6},voxtune:{key:9,scale:0,speed:0},voxlevel:{peakThreshold:-30,levelThreshold:-40,ratio:6},voxclean:{frequency:6500,threshold:-40,range:18}};
async function render(id,master=false,bypass=false){const p=emptyProject(),t=p.tracks[0];p.masterVolume=0;t.volume=0;p.bpm=120;let state;if(master){p.mastering=masteringSettings({inserts:[id],[id]:{enabled:!bypass,...settings[id]}});state=p.mastering[id];}else{placeInsert(t,0,id);Object.assign(t.effects[id],settings[id]);t.effects[id].enabled=!bypass;state=t.effects[id];}const e=new AudioEngine(()=>p,()=>new Map()),ctx=new OfflineAudioContext(2,rate*2,rate);await prepareStudioContext(ctx);const graph=e.buildGraph(ctx),osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=id==='voxtune'?215:id==='voxclean'?6500:440;gain.gain.value=.35;osc.connect(gain);gain.connect(graph.channels.get(t.id).input);osc.start(.02);osc.stop(1.55);const buffer=await ctx.startRendering();for(const ch of graph.channels.values())e.disposeChannel(ch);for(const stage of graph.mastering.effects.values())stage.dispose();return buffer;}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;output.textContent='';try{
 for(const id of Object.keys(STUDIO_EFFECTS)){if(id==='voxtune'&&!new OfflineAudioContext(1,128,rate).audioWorklet){output.textContent+='HTTPS REQUIRED · VOX TUNE (le noyau DSP est testé séparément)\n';continue;}output.textContent+='Rendu '+id+'…\n';const dry=await render(id,false,true),wet=await render(id),master=await render(id,true),a=dry.getChannelData(0),b=wet.getChannelData(0),c=master.getChannelData(0);assert([...b,...c].every(Number.isFinite),id+' non fini');assert(rms(b)>.00001&&rms(c)>.00001,id+' silencieux');let delta=0;for(let i=12000;i<50000;i++)delta+=(a[i]-b[i])**2;assert(delta>1e-5,id+' sans effet');if(id==='vectorlimit'){let peak=0;for(const ch of [b,wet.getChannelData(1)])for(const v of ch)peak=Math.max(peak,Math.abs(v));assert(peak<=10**(-6/20)+1e-5,'plafond dépassé '+peak);}if(id==='voxtune'){const f=detectPitch(b.slice(48000,52096),rate)?.frequency;assert(f&&Math.abs(f-220)<3,'justesse worklet '+f);}output.textContent+='PASS '+STUDIO_EFFECTS[id].name+' : piste + master, signal fini, effet mesuré'+(id==='voxtune'?' · 215 → 220 Hz':'')+'\n';}
 const ctx=new OfflineAudioContext(2,rate,rate),buffer=ctx.createBuffer(1,rate/2,rate);for(let i=0;i<buffer.length;i++)buffer.getChannelData(0)[i]=.3*Math.sin(2*Math.PI*440*i/rate);samplerVoice(ctx,ctx.destination,buffer,72,.01,.3,{mode:'chromatic',root:60},{attack:.001,release:.01,output:0},1);const b=await ctx.startRendering(),f=detectPitch(b.getChannelData(0).slice(3000,7096),rate)?.frequency;assert(f&&Math.abs(f-880)<5,'sampler octave '+f);output.textContent+='PASS EXO Slice : lecture chromatique, octave vérifiée à 880 Hz\n';
 output.textContent+='TOUS LES CONTRÔLES PACKS ONT RÉUSSI';
 }catch(error){output.textContent+='FAIL '+error.stack;}finally{document.querySelector('#run').disabled=false;}};
</script>
