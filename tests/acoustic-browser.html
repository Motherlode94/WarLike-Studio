<!doctype html><meta charset="utf-8"><title>Acoustic Audio QA</title><style>body{background:#20251f;color:#e1dccb;font:14px monospace;padding:30px}button{padding:12px}pre{white-space:pre-wrap}</style><h1>Pianos & acoustiques · Audio réel</h1><button id="run">Lancer les contrôles</button><pre id="results">Prêt.</pre><script type="module">
import {ACOUSTIC_INSTRUMENTS,ACOUSTIC_BANKS} from '../dist/acoustic.js';
import {loadAcousticBank,acousticVoice} from '../dist/acoustic-audio.js';
import {AudioEngine} from '../dist/audio.js';
import {createContentTrack,createContentClip} from '../dist/content.js';
const results=document.querySelector('#results'),rate=48000,assert=(ok,msg)=>{if(!ok)throw Error(msg);},rms=(b,start=.05,end=.4)=>{const d=b.getChannelData(0);let sum=0;for(let i=Math.floor(start*rate);i<Math.min(d.length,end*rate);i++)sum+=d[i]**2;return Math.sqrt(sum/((end-start)*rate));};
async function render(type,note=60,velocity=.8,settings={},duration=.7){const ctx=new OfflineAudioContext(2,rate*5,rate),bank=await loadAcousticBank(ctx,type);acousticVoice(ctx,ctx.destination,type,note,.02,duration,settings,velocity,bank);return ctx.startRendering();}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;results.textContent='';const test=async(name,fn)=>{await fn();results.textContent+='PASS '+name+'\n';};try{
 await test('12 banques : chargement, 132 MP3 décodables, signal audible et fini',async()=>{for(const [type,def] of Object.entries(ACOUSTIC_BANKS)){const ctx=new OfflineAudioContext(2,rate*4,rate),bank=await loadAcousticBank(ctx,type);assert(bank.size===def.samples.length,'missing '+type);const note=def.samples[Math.floor(def.samples.length/2)].root;acousticVoice(ctx,ctx.destination,type,note,.02,.8,{},.8,bank);const b=await ctx.startRendering();let peak=0;for(let c=0;c<2;c++)for(const value of b.getChannelData(c)){assert(Number.isFinite(value),type+' NaN');peak=Math.max(peak,Math.abs(value));}assert(peak>.001&&peak<1,type+' peak '+peak);}});
 await test('Piano : vélocité douce et forte donnent des dynamiques et des timbres distincts',async()=>{const soft=await render('piano',60,.2),hard=await render('piano',60,.95);assert(rms(hard)>rms(soft)*2,'velocity not audible');const a=soft.getChannelData(0),b=hard.getChannelData(0),ratio=rms(hard)/rms(soft);let error=0,total=0;for(let i=2000;i<15000;i++){error+=(b[i]-a[i]*ratio)**2;total+=b[i]*b[i];}assert(error/total>.1,'same recording for both layers');});
 await test('Piano : transposition d’une octave et accordage correct',async()=>{const b=await render('piano',60,.8,{transpose:12}),d=b.getChannelData(0),lo=rate/540,hi=rate/510;let best=0,lag=0;for(let k=Math.floor(lo);k<=Math.ceil(hi);k++){let sum=0;for(let i=4000;i<13000;i++)sum+=d[i]*d[i+k];if(sum>best){best=sum;lag=k;}}assert(best>0&&rate/lag>510&&rate/lag<540,'octave incorrect');});
 await test('Piano : release réglable et absence de note bloquée',async()=>{const short=await render('piano',60,.8,{release:.08},.3),long=await render('piano',60,.8,{release:1.5},.3);assert(rms(long,.5,.7)>rms(short,.5,.7)*20,'release ignored');assert(rms(long,2.5,3)<1e-6,'stuck note');});
 await test('Cordes et vents : sustain bouclé audible après la durée du sample',async()=>{for(const type of ['violin','cello','flute','trumpet']){const def=ACOUSTIC_BANKS[type],ctx=new OfflineAudioContext(2,rate*9,rate),bank=await loadAcousticBank(ctx,type);acousticVoice(ctx,ctx.destination,type,def.samples[2].root,.02,7,{},.8,bank);const b=await ctx.startRendering();assert(rms(b,6,6.5)>.00001,type+' sustain missing');assert(rms(b,8,8.5)<1e-6,type+' stuck');}});
 await test('Largeur à zéro : mono cohérent et niveau conservé',async()=>{const b=await render('piano',60,.8,{width:0}),l=b.getChannelData(0),r=b.getChannelData(1);for(let i=0;i<l.length;i+=37)assert(Math.abs(l[i]-r[i])<1e-7,'not mono');assert(rms(b)>.001,'silent mono');});
 await test('Export offline : accord de piano et inserts vides',async()=>{const t=createContentTrack('piano');t.volume=0;t.clips=[createContentClip('piano','Accords',0,1)];const project={bpm:120,bars:1,swing:0,masterVolume:0,mastering:{inserts:[]},tracks:[t]},engine=new AudioEngine(()=>project,()=>new Map()),b=await engine.renderRange({sampleRate:48000});assert(rms(b)>.001,'silent export');assert(t.inserts.every(x=>!x),'auto inserted effect');assert(b.numberOfChannels===2,'not stereo');});
 await test('PULSE : les huit percussions restent audibles',async()=>{for(const voice of ['kick','clap','hat','open','rim','tom','shaker','perc']){const ctx=new OfflineAudioContext(2,rate,rate),engine=new AudioEngine(()=>({masterVolume:0}),()=>new Map());engine.drum(ctx,ctx.destination,voice,.01,false,{},.8);const b=await ctx.startRendering();assert(rms(b,.02,.1)>.0001,voice+' silent');}});
 await test('Piste Instrument vide : aucun son de substitution',async()=>{const ctx=new OfflineAudioContext(2,rate,rate),engine=new AudioEngine(()=>({masterVolume:0}),()=>new Map());engine.synth(ctx,ctx.destination,'instrument',60,.01,.4);const b=await ctx.startRendering();assert(rms(b)===0,'unassigned instrument made a sound');});
 results.textContent+='TOUS LES CONTRÔLES ACOUSTIQUES ONT RÉUSSI';}catch(e){results.textContent+='FAIL '+e.stack;}finally{document.querySelector('#run').disabled=false;}};
</script>
