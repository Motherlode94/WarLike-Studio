<!doctype html><meta charset="utf-8"><title>EXO Audio QA</title><style>body{background:#102027;color:#c8ebe5;font:14px monospace;padding:32px}button{padding:12px}pre{white-space:pre-wrap}</style><h1>EXO · rendu audio réel</h1><button id="run">Lancer les contrôles EXO</button><pre id="results">Prêt.</pre><script type="module">
import {exoVoice} from '../dist/exo-audio.js';
import {EXO_PRESETS,exoSettings} from '../dist/exo.js';
import {AudioEngine} from '../dist/audio.js';
import {ensurePlugins,placeInsert,copyInsert} from '../dist/plugins.js';
const result=document.querySelector('#results'),assert=(ok,message)=>{if(!ok)throw Error(message);},rms=(b,from=.5,to=1)=>{const d=b.getChannelData(0);let sum=0;for(let i=Math.floor(from*b.sampleRate);i<Math.floor(to*b.sampleRate);i++)sum+=d[i]**2;return Math.sqrt(sum/((to-from)*b.sampleRate));};
async function fx(id,settings={},frequency=1000,amplitude=.2,options={}){const rate=48000,ctx=new OfflineAudioContext(2,rate*2,rate),tr={id:'a',type:options.stereo?'bus':'audio',name:'QA',volume:0,pan:0,clips:[],mute:false,solo:false};ensurePlugins(tr);if(id){placeInsert(tr,0,id);Object.assign(tr.effects[id],settings);if(options.duplicate){copyInsert(tr,0,1);Object.assign(tr.effects[tr.inserts[1]],options.duplicate);}}tr.automation=options.automation||{mode:'off',curves:{}};const p={bpm:120,bars:1,swing:0,masterVolume:0,mastering:{inserts:[]},tracks:[tr]},engine=new AudioEngine(()=>p,()=>new Map()),graph=engine.buildGraph(ctx),buffer=ctx.createBuffer(options.stereo?2:1,rate*1.8,rate),data=buffer.getChannelData(0);if(options.impulse)data[0]=1;else for(let i=0;i<data.length;i++)data[i]=Math.sin(2*Math.PI*frequency*i/rate)*amplitude;if(options.stereo){const right=buffer.getChannelData(1);for(let i=0;i<right.length;i++)right[i]=data[i]*.35;}const source=ctx.createBufferSource();source.buffer=buffer;source.connect(graph.channels.get('a').input);source.start(.01);if(options.automation)engine.scheduleAutomation(ctx,graph,0,1,.01);const rendered=await ctx.startRendering();for(const channel of graph.channels.values()){channel.pack.dispose();for(const child of channel.instanceChannels.values())child.pack.dispose();}return rendered;}
const harmonic=(b,frequency)=>{const d=b.getChannelData(0),start=Math.floor(.5*b.sampleRate),n=Math.floor(.25*b.sampleRate);let re=0,im=0;for(let i=0;i<n;i++){re+=d[start+i]*Math.cos(2*Math.PI*frequency*i/b.sampleRate);im+=d[start+i]*Math.sin(2*Math.PI*frequency*i/b.sampleRate);}return 2*Math.hypot(re,im)/n;};
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;result.textContent='';const test=async(name,fn)=>{await fn();result.textContent+='PASS '+name+'\n';};try{
 await test('32 presets : signal fini, audible, stéréo et sous 0 dBFS',async()=>{for(const preset of EXO_PRESETS){const ctx=new OfflineAudioContext(2,48000*3,48000);exoVoice(ctx,ctx.destination,60,.01,.7,exoSettings(preset.values));const b=await ctx.startRendering();let peak=0,energy=0;for(let c=0;c<2;c++)for(const x of b.getChannelData(c)){assert(Number.isFinite(x),preset.name+' non fini');peak=Math.max(peak,Math.abs(x));energy+=x*x;}assert(peak>.0001&&peak<1&&energy>1e-5,preset.name+' niveau '+peak);}});
 await test('EXO STRIP : gain −6 dB et traitement parallèle',async()=>{const base=await fx('exostrip',{highpass:20,body:0,presence:0,air:0,threshold:0,ratio:1,mix:1,output:0}),lower=await fx('exostrip',{highpass:20,body:0,presence:0,air:0,threshold:0,ratio:1,mix:1,output:-6}),dry=await fx(null),parallel=await fx('exostrip',{mix:0,output:0});assert(Math.abs(20*Math.log10(rms(lower)/rms(base))+6)<.05,'output');assert(Math.abs(rms(parallel)/rms(dry)-1)<.01,'parallel dry ratio '+rms(parallel)/rms(dry));});
 await test('EXO STRIP : image stéréo et niveau préservés',async()=>{const settings={highpass:20,body:0,presence:0,air:0,threshold:0,ratio:1,mix:1,output:0},a=await fx(null,{},1000,.2,{stereo:true}),b=await fx('exostrip',settings,1000,.2,{stereo:true});assert(Math.abs(rms(b)/rms(a)-1)<.01,'stereo level');const l=b.getChannelData(0),r=b.getChannelData(1);let sumL=0,sumR=0;for(let i=24000;i<48000;i++){sumL+=l[i]*l[i];sumR+=r[i]*r[i];}assert(Math.abs(Math.sqrt(sumR/sumL)-.35)<.01,'stereo image');});
 await test('EXO FOCUS : réduction au seuil, bande ciblée et signal faible préservé',async()=>{const a=await fx(null,{},1000,.4),b=await fx('exofocus',{frequency:1000,q:2,threshold:-30,range:9},1000,.4),quiet=await fx(null,{},1000,.01),quietOut=await fx('exofocus',{frequency:1000,q:2,threshold:-12,range:9},1000,.01),far=await fx('exofocus',{frequency:1000,q:4,threshold:-30,range:9},12000,.2),farDry=await fx(null,{},12000,.2);assert(rms(b)/rms(a)<.65,'no reduction');assert(Math.abs(rms(quietOut)/rms(quiet)-1)<.02,'quiet changed');assert(Math.abs(rms(far)/rms(farDry)-1)<.04,'off band changed');});
 await test('EXO AIR : harmoniques ajoutées et graves préservés',async()=>{const wet=await fx('exoair',{frequency:2000,drive:18,mix:1},3000,.4),dry=await fx(null,{},3000,.4),bass=await fx('exoair',{frequency:4500,drive:18,mix:1},100,.2),bassDry=await fx(null,{},100,.2);assert(harmonic(wet,9000)>harmonic(dry,9000)+.003,'no harmonic');assert(Math.abs(rms(bass)/rms(bassDry)-1)<.01,'bass changed');});
 await test('EXO SPACE : pré-délai, queue audible et largeur stéréo',async()=>{const b=await fx('exospace',{predelay:100,decay:1.5,width:1,mix:.8},1000,.2,{impulse:true}),l=b.getChannelData(0),r=b.getChannelData(1);let early=0,late=0,diff=0;for(let i=2000;i<4500;i++)early+=l[i]**2;for(let i=7000;i<40000;i++){late+=l[i]**2;diff+=(l[i]-r[i])**2;}assert(early<1e-12,'predelay failed');assert(late>1e-8&&diff>1e-8,'tail/stereo missing');});
 await test('Deux EXO STRIP indépendants : gain cumulé −6 dB',async()=>{const clean={highpass:20,body:0,presence:0,air:0,threshold:0,ratio:1,mix:1,output:-3},one=await fx('exostrip',{...clean,output:-6}),two=await fx('exostrip',clean,1000,.2,{duplicate:clean});assert(Math.abs(20*Math.log10(rms(two)/rms(one)))<.05,'duplicate gain');});
 await test('Automation EXO AIR : rampe de sortie réelle',async()=>{const b=await fx('exoair',{mix:0,output:0},1000,.2,{automation:{mode:'read',curves:{'exoair:output':[{bar:0,value:-18},{bar:1,value:0}]}}});assert(rms(b,1.4,1.6)>rms(b,.2,.4)*3,'automation not applied');});
 await test('Pattern EXO avec arp : rendu WAV offline audible',async()=>{const t={id:'exo',name:'EXO',type:'exo',color:'#8acdc8',volume:0,pan:0,clips:[{id:'arp',name:'Arp',start:0,length:1,patternSteps:16,notes:[57,60,64].map(midi=>({midi,step:0,len:16,velocity:.6}))}]};ensurePlugins(t);Object.assign(t.instrument,exoSettings(EXO_PRESETS[24].values));const p={bpm:120,bars:1,swing:0,masterVolume:0,mastering:{inserts:[]},tracks:[t]},e=new AudioEngine(()=>p,()=>new Map()),b=await e.renderRange({sampleRate:48000,tail:false});assert(rms(b,.3,1)>.001,'silent arp export');assert(b.numberOfChannels===2&&b.sampleRate===48000,'export format');});
 result.textContent+='TOUS LES CONTRÔLES EXO ONT RÉUSSI';}catch(e){result.textContent+='FAIL '+e.stack;}finally{document.querySelector('#run').disabled=false;}};
</script>
