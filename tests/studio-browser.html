<!doctype html><html lang="fr"><meta charset="utf-8"><title>CHAYAH Studio Audio QA</title><style>body{background:#293446;color:#dce9f6;font:15px system-ui;padding:25px}button{padding:12px}pre{white-space:pre-wrap;line-height:1.8}</style><h1>CHAYAH · Session, routage, automation et PCM</h1><button id="run">Tester le studio</button><pre id="results">Prêt.</pre><script type="module">
import {AudioEngine,emptyProject} from './audio.js';import {ensurePlugins,placeInsert,copyInsert} from './plugins.js';import {createPcmCapture} from './pcm-capture.js';
const out=document.querySelector('#results'),sr=48000,lines=[],pass=s=>{lines.push('PASS · '+s);out.textContent=lines.join('\n');},rms=(b,a=.2,z=.7)=>{const x=b.getChannelData(0);let sum=0,n=0;for(let i=a*b.sampleRate|0;i<Math.min(x.length,z*b.sampleRate);i++){sum+=x[i]**2;n++;}return Math.sqrt(sum/n);};
function setup(){const p=emptyProject();p.bars=2;p.bpm=120;p.delayCompensation=false;const ctx=new OfflineAudioContext(2,sr,sr),buffer=ctx.createBuffer(2,sr,sr);for(let c=0;c<2;c++){const a=buffer.getChannelData(c);for(let i=0;i<a.length;i++)a[i]=.12*Math.sin(2*Math.PI*440*i/sr);}p.tracks[0].clips=[{id:'clip',name:'Test',start:0,length:.5,audioId:'signal',gainDb:0,fadeIn:0,fadeOut:0}];const assets=new Map([['signal',{buffer}]]),engine=new AudioEngine(()=>p,()=>assets);return {p,engine,assets};}
async function render(engine,options={}){return engine.renderRange({sampleRate:sr,startBar:0,endBar:1,tail:false,...options});}
document.querySelector('#run').onclick=async()=>{try{
  const {p,engine}=setup(),t=p.tracks[0],dry=await render(engine),bus={id:'voxbus',name:'VOX',type:'bus',volume:-6,pan:0,mute:false,solo:false,clips:[]};ensurePlugins(bus);p.tracks.push(bus);t.output=bus.id;const grouped=await render(engine),db=20*Math.log10(rms(grouped)/rms(dry));if(Math.abs(db+6)>.05)throw Error('Bus gain '+db);pass('Sortie vers VOX : −6 dB mesurés sur le rendu');
  t.output='master';t.volume=-48;bus.volume=0;t.sends=[{id:'send',target:bus.id,level:-6,pre:true,enabled:true}];const pre=await render(engine);if(rms(pre)<rms(dry)*.49)throw Error('Envoi pré-fader inactif');t.mute=true;const muted=await render(engine);if(rms(muted)>1e-7)throw Error('Mute laisse passer un envoi');t.mute=false;pass('Envoi pré-fader actif et mute respecté');
  t.sends=[];t.volume=0;t.output=bus.id;t.solo=true;const solo=await render(engine);if(rms(solo)<rms(dry)*.99)throw Error('Solo coupe son bus');t.solo=false;pass('Solo d’une piste : son bus reste audible');
  t.output='master';p.tracks=[t];t.automation={mode:'read',curves:{volume:[{bar:0,value:-24},{bar:.5,value:0}]}};const automated=await render(engine);if(rms(automated,.72,.9)<rms(automated,.1,.2)*4)throw Error('Automation volume inaudible');t.mute=true;const mutedAuto=await render(engine);if(rms(mutedAuto)>1e-7)throw Error('Automation contourne mute');t.mute=false;pass('Automation audio-time et mute cohérents');
  t.automation={mode:'off',curves:{}};placeInsert(t,0,'prism');t.effects.prism.mid=6;t.effects.prism.midFreq=440;const second=copyInsert(t,0,1);t.effects[second].mid=-12;t.effects[second].midFreq=440;const two=await render(engine);t.effects[second].enabled=false;const one=await render(engine);if(rms(two)>rms(one)*.4)throw Error('Instances EQ partagent leurs réglages');pass('Deux PRISM indépendants traitent réellement le son');
  t.inserts=[];for(const e of Object.values(t.effects))e.enabled=false;t.clips[0].fadeIn=.5;const faded=await render(engine);if(rms(faded,.05,.1)>rms(faded,.7,.8)*.25)throw Error('Fondu inactif');pass('Fondus de clips pris en compte dans le rendu');
  const wav24=new DataView(await engine.exportWav({sampleRate:48000,bits:24,endBar:1,tail:false})),wav32=new DataView(await engine.exportWav({sampleRate:44100,bits:32,endBar:1,tail:false}));if(wav24.getUint16(34,true)!==24||wav24.getUint32(24,true)!==48000||wav32.getUint16(20,true)!==3)throw Error('Format export incorrect');pass('WAV 24 bits / 48 kHz et WAV flottant 32 bits');
  const source={...t.clips[0],fadeIn:0,fadeOut:0};t.clips=[source];const frozen=await render(engine,{captureId:t.id,preFader:true});t.volume=-18;const frozenLow=await render(engine,{captureId:t.id,preFader:true});if(Math.abs(rms(frozen)-rms(frozenLow))>1e-5)throw Error('Gel inclut le fader');pass('Gel audio avant fader, sans double application du volume');
  const midi=emptyProject();midi.bars=4;midi.tracks[0].type='keys';midi.tracks[0].clips=[{id:'midi',start:0,length:4,patternSteps:64,notes:[{step:48,midi:60,len:4,velocity:1}]}];ensurePlugins(midi.tracks[0]);const midiEngine=new AudioEngine(()=>midi,()=>new Map()),loud=await midiEngine.renderRange({sampleRate:48000,endBar:4,tail:false});midi.tracks[0].clips[0].notes[0].velocity=.25;const soft=await midiEngine.renderRange({sampleRate:48000,endBar:4,tail:false}),velocityGain=20*Math.log10(rms(soft,6.1,6.4)/rms(loud,6.1,6.4));if(Math.abs(velocityGain+12.0412)>.1||rms(loud,.1,.5)>1e-6)throw Error('Longueur MIDI / vélocité '+velocityGain);pass('Pattern de quatre mesures et vélocité : '+velocityGain.toFixed(2)+' dB mesurés');
  const check=new AudioContext(),available=!!check.audioWorklet;await check.close();if(!available){lines.push('SKIP · AudioWorklet exige un contexte sécurisé ; la prévisualisation HTTP ne permet pas la capture PCM.');}
  out.textContent=lines.join('\n')+'\nTOUS LES ESSAIS ONT RÉUSSI';document.body.dataset.result='pass';
}catch(error){out.textContent=lines.join('\n')+'\nFAIL · '+error.stack;document.body.dataset.result='fail';}};
</script></html>
